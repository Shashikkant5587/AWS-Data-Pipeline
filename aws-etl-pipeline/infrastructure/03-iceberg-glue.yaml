AWSTemplateFormatVersion: '2010-09-09'
Description: 'Apache Iceberg Integration with AWS Glue for ETL Pipeline'

Parameters:
  ProjectName:
    Type: String
    Default: 'etl-pipeline'
    Description: 'Name of the ETL project'
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: 'Environment name'

Resources:
  # S3 Bucket for Iceberg Warehouse
  IcebergWarehouseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-iceberg-warehouse-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
              KMSMasterKeyID: !ImportValue
                Fn::Sub: '${ProjectName}-${Environment}-KMSKey'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
      LoggingConfiguration:
        DestinationBucketName: !Sub '${ProjectName}-${Environment}-access-logs-${AWS::AccountId}'
        LogFilePrefix: 'iceberg-warehouse-access-logs/'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-iceberg-warehouse'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # Glue Database for Iceberg Tables
  IcebergGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${ProjectName}_${Environment}_iceberg_warehouse'
        Description: 'Iceberg tables database for ETL pipeline'
        Parameters:
          'iceberg.enabled': 'true'
          'iceberg.catalog': 'glue_catalog'
          'iceberg.warehouse': !Sub 's3://${IcebergWarehouseBucket}/warehouse/'

  # Enhanced IAM Role for Glue with Iceberg permissions
  IcebergGlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-iceberg-glue-service-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: IcebergGluePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub '${IcebergWarehouseBucket}/*'
                  - !GetAtt IcebergWarehouseBucket.Arn
                  - !ImportValue
                      Fn::Sub: '${ProjectName}-${Environment}-DataLakeBucket'
                  - !Sub
                    - '${DataLakeBucket}/*'
                    - DataLakeBucket: !ImportValue
                        Fn::Sub: '${ProjectName}-${Environment}-DataLakeBucket'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:CreatePartition
                  - glue:UpdatePartition
                  - glue:DeletePartition
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:BatchUpdatePartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}_${Environment}_iceberg_warehouse'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}_${Environment}_iceberg_warehouse/*'
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !ImportValue
                  Fn::Sub: '${ProjectName}-${Environment}-KMSKey'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  # Glue Job for Iceberg User Transformation
  IcebergUserTransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-iceberg-transform-users'
      Role: !GetAtt IcebergGlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ProjectName}-${Environment}-scripts-${AWS::AccountId}/glue-jobs/iceberg_transform_users.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': 'python'
        '--job-bookmark-option': 'job-bookmark-enable'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${ProjectName}-${Environment}-spark-logs-${AWS::AccountId}/'
        '--additional-python-modules': 'pyiceberg'
        '--conf': 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${IcebergWarehouseBucket}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
        '--ICEBERG_WAREHOUSE_PATH': !Sub 's3://${IcebergWarehouseBucket}/warehouse/'
        '--DATABASE_NAME': !Ref IcebergGlueDatabase
      GlueVersion: '4.0'
      MaxRetries: 2
      Timeout: 2880
      MaxCapacity: 10
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # Glue Job for Iceberg Order Transformation
  IcebergOrderTransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-iceberg-transform-orders'
      Role: !GetAtt IcebergGlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ProjectName}-${Environment}-scripts-${AWS::AccountId}/glue-jobs/iceberg_transform_orders.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': 'python'
        '--job-bookmark-option': 'job-bookmark-enable'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${ProjectName}-${Environment}-spark-logs-${AWS::AccountId}/'
        '--additional-python-modules': 'pyiceberg'
        '--conf': 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${IcebergWarehouseBucket}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
        '--ICEBERG_WAREHOUSE_PATH': !Sub 's3://${IcebergWarehouseBucket}/warehouse/'
        '--DATABASE_NAME': !Ref IcebergGlueDatabase
      GlueVersion: '4.0'
      MaxRetries: 2
      Timeout: 2880
      MaxCapacity: 10
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # Glue Job for Iceberg Table Maintenance
  IcebergMaintenanceJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-iceberg-maintenance'
      Role: !GetAtt IcebergGlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ProjectName}-${Environment}-scripts-${AWS::AccountId}/glue-jobs/iceberg_maintenance.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': 'python'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${ProjectName}-${Environment}-spark-logs-${AWS::AccountId}/'
        '--additional-python-modules': 'pyiceberg'
        '--conf': 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${IcebergWarehouseBucket}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
        '--ICEBERG_WAREHOUSE_PATH': !Sub 's3://${IcebergWarehouseBucket}/warehouse/'
        '--DATABASE_NAME': !Ref IcebergGlueDatabase
      GlueVersion: '4.0'
      MaxRetries: 1
      Timeout: 1440
      MaxCapacity: 5
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # EventBridge Rule for Daily Iceberg Maintenance
  IcebergMaintenanceSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-iceberg-maintenance'
      Description: 'Daily Iceberg table maintenance'
      ScheduleExpression: 'cron(0 4 * * ? *)'  # Run at 4 AM UTC daily
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${IcebergMaintenanceJob}'
          Id: 'IcebergMaintenanceTarget'
          RoleArn: !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-StepFunctionsExecutionRole'

Outputs:
  IcebergWarehouseBucketName:
    Description: 'Name of the Iceberg warehouse S3 bucket'
    Value: !Ref IcebergWarehouseBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergWarehouseBucket'

  IcebergGlueDatabaseName:
    Description: 'Name of the Iceberg Glue database'
    Value: !Ref IcebergGlueDatabase
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergGlueDatabase'

  IcebergGlueServiceRoleArn:
    Description: 'ARN of the Iceberg Glue service role'
    Value: !GetAtt IcebergGlueServiceRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergGlueServiceRole'

  IcebergUserTransformJobName:
    Description: 'Name of the Iceberg user transform job'
    Value: !Ref IcebergUserTransformJob
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergUserTransformJob'

  IcebergOrderTransformJobName:
    Description: 'Name of the Iceberg order transform job'
    Value: !Ref IcebergOrderTransformJob
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergOrderTransformJob'

  IcebergMaintenanceJobName:
    Description: 'Name of the Iceberg maintenance job'
    Value: !Ref IcebergMaintenanceJob
    Export:
      Name: !Sub '${ProjectName}-${Environment}-IcebergMaintenanceJob'