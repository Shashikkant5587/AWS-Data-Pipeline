stages:
  - validate
  - test
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  AWS_DEFAULT_REGION: us-east-1
  PROJECT_NAME: etl-pipeline
  PYTHON_VERSION: "3.9"

# Cache for dependencies
cache:
  paths:
    - .pip-cache/

before_script:
  - apt-get update -qq && apt-get install -y -qq git curl unzip
  - pip install --cache-dir .pip-cache awscli boto3 cfn-lint pytest

# Validate CloudFormation templates
validate-templates:
  stage: validate
  script:
    - echo "Validating CloudFormation templates..."
    - for template in infrastructure/*.yaml; do
        echo "Validating $template"
        aws cloudformation validate-template --template-body file://$template
        cfn-lint $template
      done
  only:
    - merge_requests
    - main
    - develop

# Test Lambda functions
test-lambda:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - echo "Running Lambda function tests..."
    - cd lambda/extract_database
    - pip install -r requirements.txt
    - pip install pytest moto
    - python -m pytest tests/ -v
    - cd ../extract_api
    - pip install -r requirements.txt
    - pip install pytest moto requests-mock
    - python -m pytest tests/ -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - main
    - develop

# Build Lambda deployment packages
build-lambda:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - echo "Building Lambda deployment packages..."
    - mkdir -p build/lambda
    
    # Build database extraction Lambda
    - cd lambda/extract_database
    - pip install -r requirements.txt -t .
    - zip -r ../../build/lambda/extract-database.zip .
    - cd ../..
    
    # Build API extraction Lambda
    - cd lambda/extract_api
    - pip install -r requirements.txt -t .
    - zip -r ../../build/lambda/extract-api.zip .
    - cd ../..
    
    # Build data quality Lambda
    - cd lambda/data_quality
    - pip install -r requirements.txt -t .
    - zip -r ../../build/lambda/data-quality.zip .
    - cd ../..
    
    # Build Redshift loader Lambda
    - cd lambda/load_redshift
    - pip install -r requirements.txt -t .
    - zip -r ../../build/lambda/load-redshift.zip .
    - cd ../..
    
  artifacts:
    paths:
      - build/lambda/
    expire_in: 1 hour
  only:
    - main
    - develop

# Deploy to Development Environment
deploy-dev:
  stage: deploy-dev
  environment:
    name: development
    url: https://console.aws.amazon.com/cloudformation
  script:
    - echo "Deploying to Development environment..."
    - export ENVIRONMENT=dev
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_DEV
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_DEV
    - ./scripts/deploy.sh $ENVIRONMENT
  dependencies:
    - build-lambda
  only:
    - develop
  when: manual

# Deploy to Staging Environment
deploy-staging:
  stage: deploy-staging
  environment:
    name: staging
    url: https://console.aws.amazon.com/cloudformation
  script:
    - echo "Deploying to Staging environment..."
    - export ENVIRONMENT=staging
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_STAGING
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_STAGING
    - ./scripts/deploy.sh $ENVIRONMENT
  dependencies:
    - build-lambda
  only:
    - main
  when: manual

# Deploy to Production Environment
deploy-prod:
  stage: deploy-prod
  environment:
    name: production
    url: https://console.aws.amazon.com/cloudformation
  script:
    - echo "Deploying to Production environment..."
    - export ENVIRONMENT=prod
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_PROD
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_PROD
    - ./scripts/deploy.sh $ENVIRONMENT
  dependencies:
    - build-lambda
  only:
    - main
  when: manual
  allow_failure: false

# Rollback job (manual trigger)
rollback-prod:
  stage: deploy-prod
  environment:
    name: production
    url: https://console.aws.amazon.com/cloudformation
  script:
    - echo "Rolling back Production deployment..."
    - export ENVIRONMENT=prod
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_PROD
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_PROD
    - ./scripts/rollback.sh $ENVIRONMENT
  only:
    - main
  when: manual